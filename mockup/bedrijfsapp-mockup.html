<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>De Impact Club — Bedrijfsapp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Funnel+Sans:wght@300..800&display=swap" rel="stylesheet">
<style>
:root{
  /* palet Zand & Blauwsteen — design system versie 2.0 */
  --zand:#F7F5F1; --zand-2:#F1EFEB; --mist:#E8EAE9;
  --head:#1E2733;            /* nachtblauw: header en zijbalk */
  --head-ink:#E7EBEE;
  --diep:#23303C;
  --ink:#1E2733;
  --muted:#5D6874;
  --line:#E0E1DE;
  --line-2:#EDEDEA;
  --bg:#FBFAF7;              /* app-grond, net iets lichter dan zand */
  --surface:#FFFFFF;
  --soft:#F1EFEB;
  --steen:#4C6274; --steen-600:#3B4E5E; --steen-400:#8FA5B5; --steen-50:#E4E9EC;
  --klei:#D8C3B1; --klei-600:#B79773;
  /* sessieblokken: Club is blauwsteen, PT is klei */
  --green:#DCE4EA; --green-bd:#BFCEDA; --green-ink:#33485A;
  --sand:#EFE6DA; --sand-bd:#D8C3B1; --sand-ink:#7C5F3C;
  --sky:#E2E9E3; --sky-bd:#C4D3C6; --sky-ink:#435C4A;
  --acc:#5F7A63;             /* sage: bezetting, betaald, aanwezig */
  --red:#9A3B3B;             /* wijn */
  --amber:#B98A3E;
  --pale:var(--steen-50);
  --display:"Righteous","Arial Black",system-ui,sans-serif;
  --body:"Funnel Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --half:46px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--mist);color:var(--ink);font-family:var(--body);
  font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.device{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative}
@media(min-width:520px){
  body{padding:20px 0}
  .device{height:calc(100dvh - 40px);min-height:0;border-radius:26px;overflow:hidden;
    box-shadow:0 20px 46px -20px rgba(31,35,23,.5)}
}

/* ---------- header ---------- */
.hdr{background:var(--head);color:var(--head-ink);flex:none;border-bottom:3px solid var(--klei)}
.hrow{display:flex;align-items:center;gap:14px;padding:14px 18px 12px;min-height:58px}
.hrow .mid{flex:1;text-align:center;font-weight:600;font-size:17px}
.hrow .mid.left{text-align:left}
.hrow .mid small{display:block;font-size:12.5px;font-weight:500;color:#BFC3B0;margin-top:1px}
.dots{letter-spacing:1px;font-size:20px;line-height:1}
.hico{width:26px;height:26px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.logo{flex:1;text-align:center;font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.04em}
.logo em{font-style:normal;color:transparent;-webkit-text-stroke:1px var(--head-ink)}
.htabs{display:flex;padding:0 10px}
.htab{flex:1;text-align:center;padding:8px 0 10px;font-weight:500;font-size:14.5px;color:#B9BCA9;position:relative}
.htab.on{color:var(--head-ink);font-weight:600}
.htab.on:after{content:"";position:absolute;left:22%;right:22%;bottom:2px;height:3px;border-radius:2px;background:var(--klei)}
.dsel{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:400;font-size:17px}

/* ---------- main ---------- */
main{flex:1;overflow-y:auto;overscroll-behavior:contain;background:var(--bg)}
.screen{display:none}
.screen.on{display:block}
.pad{padding:0 16px}
.sechead{display:flex;align-items:center;gap:11px;padding:18px 16px 6px}
.sechead .ic{width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.sechead .ic svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.7}
.sechead h2{margin:0;font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.01em}
.sechead .sub{font-size:12.5px;color:var(--muted);font-weight:400}
.rule{height:1px;background:var(--line);margin:0 16px}
.tip{margin:12px 16px 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.spacer{height:26px}

/* ---------- dashboard stats ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .lbl{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500}
.stat .lbl i{width:14px;height:14px;border-radius:50%;background:#C3C6BC;color:#fff;font-size:9.5px;
  font-style:normal;display:grid;place-items:center;font-weight:600}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:21px;letter-spacing:.01em;margin:4px 0 1px;line-height:1.15}
.stat b span{font-size:12.5px!important}
.stat small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3}
.alertbar{margin:0 16px;border:1px solid #E6D9BC;background:#FBF5E6;border-radius:14px;
  padding:11px 14px;display:flex;gap:10px;align-items:center;width:calc(100% - 32px)}
.alertbar b{font-size:13.5px;font-weight:600;display:block}
.alertbar small{font-size:12.5px;color:var(--muted)}
.alertbar .chev{margin-left:auto;color:var(--muted);font-size:20px}

/* ---------- dashboard sessiekaarten ---------- */
.daymark{display:flex;align-items:center;gap:10px;padding:14px 16px 2px}
.daymark b{font-size:13px;font-weight:600}
.daymark span{font-size:12.5px;color:var(--muted)}
.dcard{display:block;width:100%;border-top:1px solid var(--line);padding:14px 16px 16px;background:#fff}
.dtop{display:flex;gap:12px;align-items:flex-start}
.dtime{width:52px;flex:none;text-align:right}
.dtime b{display:block;font-family:var(--display);font-weight:400;font-size:16px;line-height:1.2}
.dtime small{display:block;font-size:13px;color:#A3A89A}
.dmain{flex:1;min-width:0}
.dmain .t{font-weight:600;font-size:15px;letter-spacing:-.01em}
.dmain .tr{color:var(--muted);font-size:13.5px}
.dmain .oc{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--acc);margin-top:2px}
.dmain .oc.full{color:var(--red)}
.dmain .oc svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}
.chev{color:#B9BDB2;font-size:22px;line-height:1;flex:none;align-self:center}
.focus{margin:10px 0 0 64px;background:var(--steen-50);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.45}
.focus b{font-weight:600}
.notes{margin:9px 0 0 64px;padding:0;list-style:none}
.notes li{display:flex;gap:8px;padding:5px 0;font-size:13px;line-height:1.4;border-top:1px solid var(--line-2)}
.notes li:first-child{border-top:0}
.notes .tag{flex:none;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;margin-top:1px;white-space:nowrap}
.t-blessure{background:#F8E7E4;color:var(--red)}
.t-credit{background:#FAF0DC;color:var(--amber)}
.t-nieuw{background:#E2F0E5;color:#256B37}
.t-vrij{background:#EDEEE9;color:var(--muted)}
.t-afmelding{background:#EDEEE9;color:var(--muted)}
.notes u{text-decoration:none;font-weight:600}

/* ---------- agenda ---------- */
.abar{display:flex;align-items:center;border-bottom:1px solid var(--line);background:#fff}
.abar .wk{width:64px;flex:none;text-align:center;color:var(--muted);font-size:13px;padding:9px 0}
.abar .dt{flex:1;text-align:center;font-family:var(--display);font-weight:400;font-size:16px;padding:9px 0}
.viewbar{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.viewbar .vs{width:64px;flex:none;text-align:center;padding:8px 0;font-size:13.5px;color:var(--muted);
  border-right:1px solid var(--line)}
.viewbar .chips{display:flex;gap:6px;overflow-x:auto;padding:7px 10px;scrollbar-width:none}
.viewbar .chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;
  font-weight:500;color:var(--muted);background:#fff}
.chip.on{background:var(--steen);border-color:var(--steen);color:#fff}

.tl{display:flex;position:relative}
.tlg{width:64px;flex:none;border-right:1px solid var(--line)}
.tlg div{height:var(--half);font-size:13px;color:#7C8174;padding:0 8px 0 0;text-align:right;
  transform:translateY(-8px)}
.tlb{flex:1;position:relative}
.tlb .grid div{height:var(--half);border-bottom:1px dotted #DFE0D9}
.tlb .grid div.hour{border-bottom:1px solid var(--line)}
.ev{position:absolute;border:1px solid;border-radius:5px;padding:5px 7px;overflow:hidden;display:block}
.ev .h{font-size:11.5px;font-weight:400;opacity:.85;display:flex;gap:5px;align-items:center}
.ev .n{font-size:14px;font-weight:600;line-height:1.2;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .s{font-size:12px;line-height:1.25;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.club{background:var(--green);border-color:var(--green-bd);color:var(--green-ink)}
.ev.pt{background:var(--sand);border-color:var(--sand-bd);color:var(--sand-ink)}
.ev.fund{background:var(--sky);border-color:var(--sky-bd);color:var(--sky-ink)}
.ev.intake{background:var(--mist);border-color:var(--line);color:var(--muted)}
.wev.intake{background:var(--mist);border-color:var(--line);color:var(--muted)}
.ev.full{box-shadow:inset 4px 0 0 rgba(176,57,44,.75)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:5}
.nowline:before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}

/* week (compact) */
.wkwrap{overflow-x:auto}
.wkhead{display:flex;position:sticky;top:0;background:#fff;z-index:4;border-bottom:1px solid var(--line)}
.wkhead .g{width:44px;flex:none;border-right:1px solid var(--line)}
.wkhead .d{width:78px;flex:none;text-align:center;padding:6px 0;border-right:1px solid var(--line-2);font-size:12px;color:var(--muted)}
.wkhead .d b{display:block;font-family:var(--display);font-weight:400;font-size:16px;color:var(--ink)}
.wkhead .d.today b{background:var(--steen);color:#fff;border-radius:9px;padding:0 7px;display:inline-block}
.wkbody{display:flex}
.wkg{width:44px;flex:none;border-right:1px solid var(--line)}
.wkg div{height:32px;font-size:11px;color:#8A8F82;text-align:right;padding-right:5px;transform:translateY(-6px)}
.wkcol{width:78px;flex:none;position:relative;border-right:1px solid var(--line-2)}
.wkcol .lines div{height:32px;border-bottom:1px dotted #E4E5DE}
.wev{position:absolute;left:2px;right:2px;border:1px solid;border-radius:4px;padding:2px 4px;overflow:hidden}
.wev b{display:block;font-size:10.5px;font-weight:600;line-height:1.15}
.wev small{display:block;font-size:10px;opacity:.85}

/* ---------- klanten ---------- */
.searchrow{display:flex;gap:9px;padding:13px 16px}
.sbox{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.sbox svg{width:18px;height:18px;stroke:#A3A89A;fill:none;stroke-width:2;flex:none}
.sbox input{flex:1;border:0;outline:0;font:inherit;font-size:14px;background:none;min-width:0}
.sbtn{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;flex:none}
.sbtn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.7}
.klist{display:block}
.krow{display:flex;align-items:center;gap:13px;width:100%;padding:11px 16px;border-top:1px solid var(--line-2)}
.av{width:46px;height:46px;border-radius:50%;background:var(--steen-50);color:var(--steen-600);display:grid;place-items:center;
  font-weight:600;font-size:14px;flex:none}
.av.off{background:var(--mist);color:var(--muted)}
.kmain{flex:1;min-width:0}
.kmain b{display:block;font-weight:600;font-size:15.5px;letter-spacing:-.01em}
.kmain span{display:block;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crs{display:flex;gap:3px;flex:none;align-items:center}
.cr{width:8px;height:15px;border-radius:2px;background:#E3E4DE}
.cr.on{background:var(--acc)}
.cr.soon{background:#D9A22B}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px;border-top:1px solid var(--line);
  background:var(--soft);color:var(--muted);font-size:13px}
.pager b{color:var(--ink);font-weight:600}

/* tabel */
.tablewrap{overflow-x:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:max-content;min-width:100%}
th,td{padding:10px 12px;text-align:left;font-size:13px;white-space:nowrap;border-bottom:1px solid var(--line-2)}
th{font-size:11.5px;color:var(--muted);font-weight:600;position:sticky;top:0;background:#fff;z-index:3}
.stick{position:sticky;left:0;background:#fff;z-index:2;border-right:1px solid var(--line-2);min-width:160px}
th.stick{z-index:4}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:7px;border:1px solid}
.b-club{color:var(--steen-600);background:var(--steen-50);border-color:#BFCEDA}
.b-pt{color:#8A6A44;background:#EFE6DA;border-color:var(--klei)}
.b-both{color:#8A6A44;background:#EFE6DA;border-color:#BFCEDA}
.b-fund{color:var(--sky-ink);background:var(--sky);border-color:var(--sky-bd)}
.b-off{color:var(--muted);background:var(--mist);border-color:var(--line)}
.b-red{color:var(--red);background:#F4E1E1;border-color:#E0B9B9}
.b-amber{color:#8A6520;background:#F6EBD8;border-color:#E3CB9B}

/* ---------- profiel ---------- */
.phead{display:flex;gap:14px;align-items:center;padding:16px}
.phead .av{width:60px;height:60px;font-size:18px}
.phead b{font-family:var(--display);font-weight:400;font-size:21px;letter-spacing:.01em;display:block}
.counter{margin:0 16px;background:var(--head);color:#fff;border-radius:16px;padding:15px 16px}
.counter b{display:block;font-family:var(--display);font-weight:400;font-size:21px;letter-spacing:.01em}
.counter small{display:block;color:#C0C4B2;font-size:13px;margin-top:1px}
.counter .w{margin-top:11px;background:#2C3A47;color:#E8C68A;border-radius:10px;padding:8px 11px;font-size:12.5px;font-weight:500}
.card{border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:10px 16px}
.card.tap{display:block;width:calc(100% - 32px)}
.note{background:#FBF6EE;border-color:#E9DCC6}
.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:500;text-align:right}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 16px}
.mini .s{border:1px solid var(--line);border-radius:13px;padding:11px 13px}
.mini b{display:block;font-family:var(--display);font-weight:400;font-size:20px}
.mini small{color:var(--muted);font-size:12.5px}
.btnrow{display:flex;gap:10px;margin:14px 16px 0}
.btn{flex:1;background:var(--steen);color:#fff;border-radius:999px;padding:13px;font-weight:700;font-size:14.5px;text-align:center;min-height:44px}
.btn:hover{background:var(--steen-600)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #C6CBCD}
.btn.ghost:hover{border-color:var(--ink)}

/* ---------- updates ---------- */
.upd{border-left:3px solid var(--line);border-radius:0 14px 14px 0}
.upd.sig{border-left-color:var(--red)}
.upd.att{border-left-color:#D9A22B}
.upd p{margin:8px 0 0;font-size:13.5px;color:#42473C}
.rowline{display:flex;align-items:center;gap:11px}
.when{margin-left:auto;color:var(--muted);font-size:12px;flex:none}

/* ---------- chat ---------- */
.thread{padding:14px 16px 0;display:flex;flex-direction:column;gap:9px}
.msg{max-width:82%;padding:9px 13px;border-radius:16px;font-size:14px}
.msg.them{background:var(--soft);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.msg.us{background:var(--steen);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.msg time{display:block;font-size:10.5px;opacity:.65;margin-top:3px}
.composer{display:flex;gap:9px;padding:14px 16px 0}
.composer input{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font:inherit;font-size:14px;outline:0}
.send{width:46px;border-radius:999px;background:var(--steen);color:#fff;font-weight:700;text-align:center}

/* ---------- meer / instellingen ---------- */
.mrow{display:flex;align-items:center;gap:13px;width:100%;padding:14px 16px;border-top:1px solid var(--line-2)}
.mrow .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
.mrow .ic svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.7}
.mrow b{display:block;font-size:15px;font-weight:500}
.mrow small{color:var(--muted);font-size:12.5px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 16px}
.slot{border:1px solid var(--line);border-radius:12px;padding:11px 4px;text-align:center;font-weight:500;font-size:14px}
.slot small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.slot.free{background:var(--steen-50);border-color:#BFCEDA;color:var(--steen-600)}
.slot.free small{color:var(--steen)}
.slot.taken{background:var(--sand);border-color:var(--sand-bd);color:var(--sand-ink)}
.slot.taken small{color:var(--sand-ink)}

/* ---------- formulier ---------- */
.field{padding:18px 16px 0}
.flabel{font-size:17px;font-weight:500;letter-spacing:-.01em}
.flabel em{font-style:normal;color:#C0392B}
.fhelp{color:var(--muted);font-size:14px;line-height:1.4;margin-top:8px}
.fin{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:10px;
  font:inherit;font-size:16px;outline:0;background:#fff;color:var(--ink)}
.fin:focus{border-color:var(--steen);outline:3px solid rgba(76,98,116,.22);outline-offset:1px}
select.fin{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' stroke='%23767C6E' stroke-width='1.8'><path d='M5 8l5 5 5-5'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center}
.timerow{display:flex;align-items:center;gap:12px;margin-top:10px}
.tbox{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);
  border-radius:12px;padding:11px 6px}
.tbox input{width:44px;border:0;outline:0;font:inherit;font-size:17px;text-align:center;background:none}
.tbox span{color:var(--muted)}
.timerow .tot{color:var(--muted);font-size:15px;flex:none}
.sw{width:58px;height:32px;border-radius:16px;background:#DDDED7;position:relative;margin-top:10px;
  transition:background .15s;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw.on{background:var(--steen)}
.sw.on i{transform:translateX(26px)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}
.segb{flex:1;text-align:center;padding:13px 0;font-size:14.5px;color:var(--muted);
  border-right:1px solid var(--line);background:#fff}
.segb:last-child{border-right:0}
.segb.on{background:var(--steen-50);color:var(--steen-600);font-weight:700}
.chk{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-top:9px;width:100%;font-size:15px}
.chk .box{width:22px;height:22px;border-radius:6px;border:1.5px solid #C3C6BC;flex:none;display:grid;place-items:center;color:#fff;font-size:13px}
.chk.on .box{background:var(--steen);border-color:var(--steen)}

function sheetPlekVrij(x,afgemeld){

 const wanneer=x.d===NOW.day?'vanavond':`${DAYS[x.d].k} ${DAYS[x.d].d} ${DAYS[x.d].m.toLowerCase()}`;

   <div class="savebar"><button class="btn" id="v-send"${wil.length?'':' disabled style="opacity:.5"'}>Versturen naar ${wil.length}</button>
     <button class="btn ghost" id="v-nee">Niet nu</button></div>
   <p class="tip">Je kunt dit later alsnog doen via Pushmelding in het sessiescherm.</p><div class="spacer"></div>`;

   <div class="fhelp">Jouw planning begint vanaf deze datum</div></div>

 <div class="field"><div class="flabel">Hele dag</div>
   <button class="sw${r.allDay?' on':''}" id="f-allday" role="switch" aria-checked="${r.allDay}"><i></i></button>
   <div class="fhelp">Markeert je als beschikbaar voor de hele dag (00:00–24:00)</div></div>

 ${r.allDay?'':`<div class="field"><div class="flabel">Tijd</div>
   <div class="timerow">
     <label class="tbox"><input id="f-fh" value="${r.from.slice(0,2)}" inputmode="numeric" maxlength="2"><span>:</span><input id="f-fm" value="${r.from.slice(3)}" inputmode="numeric" maxlength="2"></label>
     <span class="tot">tot</span>
     <label class="tbox"><input id="f-th" value="${r.to.slice(0,2)}" inputmode="numeric" maxlength="2"><span>:</span><input id="f-tm" value="${r.to.slice(3)}" inputmode="numeric" maxlength="2"></label>
   </div>
   ${mins(r.to)<=mins(r.from)?'<div class="fhelp" style="color:var(--red)">De eindtijd ligt voor de begintijd. Kies een eindtijd later dan '+r.from+'.</div>':''}</div>`}

 <div class="field"><div class="flabel">Herhaalt</div>
   <select class="fin" id="f-freq">
     ${['Eenmalig','Wekelijks','Om de week','Maandelijks'].map(f=>`<option${f===r.freq?' selected':''}>${f}</option>`).join('')}
   </select></div>

 ${r.freq==='Eenmalig'?'':`<div class="field"><div class="flabel">Herhalen op</div>
   <div class="seg" id="f-days">${DAGK.map((d,i)=>`<button class="segb${r.days.includes(i)?' on':''}" data-d="${i}">${d}</button>`).join('')}</div>
   <div class="fhelp">Selecteer de dagen waarop deze tijden gelden</div></div>`}

 <div class="field"><div class="flabel">Einddatum instellen</div>
   <button class="sw${r.end?' on':''}" id="f-endsw" role="switch" aria-checked="${!!r.end}"><i></i></button>
   ${r.end?`<input class="fin" id="f-end" value="${r.end}" inputmode="numeric">`:''}
   <div class="fhelp">Als er geen einddatum is ingesteld, is je beschikbaarheid doorlopend</div></div>

 <div class="field"><div class="flabel">Toepassen op alle privéactiviteiten</div>
   <button class="sw${r.alle?' on':''}" id="f-alle" role="switch" aria-checked="${r.alle}"><i></i></button>
   <div class="fhelp">Als uit, kies op welke privéactiviteiten je beschikbare uren van toepassing zijn</div>
   ${r.alle?'':ACTS.map(a=>`<button class="chk${r.act.includes(a)?' on':''}" data-a="${a}"><span class="box">✓</span>${a}</button>`).join('')}</div>

 <div class="preview">${r.days.length===0&&r.freq!=='Eenmalig'
   ?'<b>Nog geen dagen gekozen.</b> Zolang er geen dag aan staat, ziet een PT-klant geen enkel moment van je.'
   :`<b>${r.freq==='Eenmalig'?uren(r)+' uur eenmalig':perweek+' uur per week'}</b> op ${dagtekst(r)}${r.allDay?'':', van '+r.from+' tot '+r.to}. ${r.alle?'Geldt voor alle privéactiviteiten.':'Geldt voor '+(r.act.join(' en ')||'nog geen activiteit')+'.'}`}</div>

 <div class="savebar"><button class="btn" id="f-save">Opslaan</button>
   ${r.id?'<button class="btn ghost" id="f-del">Verwijderen</button>':''}</div>
 <div class="spacer"></div>`;

 const upd=(k,v)=>{editRule[k]=v;renderRule()};
 $('#f-allday').onclick=()=>upd('allDay',!r.allDay);
 $('#f-alle').onclick=()=>upd('alle',!r.alle);
 $('#f-endsw').onclick=()=>upd('end',r.end?null:r.start);
 $('#f-freq').onchange=e=>upd('freq',e.target.value);
 $('#f-start').onchange=e=>upd('start',e.target.value);
 if($('#f-end'))$('#f-end').onchange=e=>upd('end',e.target.value);
 s.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
  const i=+b.dataset.d, d=r.days.includes(i)?r.days.filter(x=>x!==i):[...r.days,i].sort((a,b)=>a-b);
  upd('days',d);
 });
 s.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
  const a=b.dataset.a, l=r.act.includes(a)?r.act.filter(x=>x!==a):[...r.act,a];
  upd('act',l);
 });
 ['f-fh','f-fm','f-th','f-tm'].forEach(idd=>{const i=$('#'+idd);if(!i)return;
  i.onchange=()=>{
   const p=x=>String(Math.min(idd.endsWith('h')?23:59,Math.max(0,parseInt($('#'+x).value||'0',10)))).padStart(2,'0');
   editRule.from=p('f-fh')+':'+p('f-fm');editRule.to=p('f-th')+':'+p('f-tm');renderRule();
  }});
 $('#f-save').onclick=()=>{
  if(r.freq!=='Eenmalig'&&r.days.length===0){toast('Kies eerst een dag','Zonder dagen levert deze beschikbaarheid geen enkel boekbaar moment op in de klantapp.');return}
  if(!r.allDay&&mins(r.to)<=mins(r.from)){toast('Eindtijd klopt niet','De eindtijd ligt voor de begintijd. Kies een eindtijd later dan '+r.from+'.');return}
  if(!r.alle&&r.act.length===0){toast('Kies een activiteit','Zet de schakelaar aan voor alle privéactiviteiten, of vink er minstens één aan.');return}
  if(r.id)AVAIL=AVAIL.map(x=>x.id===r.id?r:x); else {r.id=Math.max(0,...AVAIL.map(x=>x.id))+1;AVAIL.push(r)}
  show('beschik');
  toast('Beschikbaarheid opgeslagen',`${r.freq==='Eenmalig'?uren(r)+' uur':uren(r)*r.days.length+' uur per week'} op ${dagtekst(r)} staat nu open. PT-klanten met een geldige credit zien deze momenten meteen in hun app.`);
 };
 if($('#f-del'))$('#f-del').onclick=()=>{
  $('#sheetbody').innerHTML=`<h3>Beschikbaarheid verwijderen</h3>
   <p class="sub">Al geboekte PT-sessies binnen dit blok blijven staan. Alleen nog vrije uren verdwijnen uit de klantapp.</p>
   <div class="btnrow"><button class="btn" id="d-ja" style="background:var(--red)">Verwijderen</button>
   <button class="btn ghost" id="d-nee">Behouden</button></div><div class="spacer"></div>`;
  $('#d-ja').onclick=()=>{AVAIL=AVAIL.filter(x=>x.id!==r.id);closeSheet();show('beschik')};
  $('#d-nee').onclick=closeSheet;openSheet();
 };
}
function sheetRegelmenu(){
 $('#sheetbody').innerHTML=`<h3>Meer opties</h3><p class="sub">Voor dit beschikbaarheidsblok</p>
  <button class="mrow" id="m-dup"><span class="ic">${IC.plus}</span><span style="flex:1"><b>Dupliceren</b><small>Zelfde tijden, andere dagen</small></span></button>
  <button class="mrow" id="m-week"><span class="ic">${IC.cal}</span><span style="flex:1"><b>Bekijken in de agenda</b><small>Zie waar het botst met clubtrainingen</small></span></button>
  <div class="spacer"></div>`;
 $('#m-dup').onclick=()=>{editRule={...JSON.parse(JSON.stringify(editRule)),id:null};closeSheet();renderRule()};
 $('#m-week').onclick=()=>{closeSheet();aview='week';show('agenda')};
 openSheet();
}

/* =============== rooster =============== */
let FORM=null;
const FORMTITEL=()=>!FORM?'Rooster':FORM.mode==='reeks'?(FORM.id?'Reeks bewerken':'Nieuwe reeks')
  :FORM.mode==='sessie'?'Losse sessie':'Nieuwe activiteit';
const TYL={club:'Clubtraining',pt:'Personal Training',fund:'Fundament',intake:'Intake'};

function sheetNieuw(){
 $('#sheetbody').innerHTML=`<h3>Toevoegen aan het rooster</h3>
  <p class="sub">Een reeks komt elke week terug, een losse sessie staat er één keer in</p>
  <button class="mrow" data-n="reeks"><span class="ic">${IC.sync}</span>
    <span style="flex:1"><b>Terugkerende reeks</b><small>Vaste clubtraining op vaste dagen en tijd</small></span><span class="chev">›</span></button>
  <button class="mrow" data-n="sessie"><span class="ic">${IC.cal}</span>
    <span style="flex:1"><b>Losse sessie</b><small>Eenmalig, bijvoorbeeld een proefles of workshop</small></span><span class="chev">›</span></button>
  <button class="mrow" data-n="activiteit"><span class="ic">${IC.plus}</span>
    <span style="flex:1"><b>Nieuwe activiteit</b><small>Een nieuwe lesvorm zoals CORE of HYBRID</small></span><span class="chev">›</span></button>
  <div class="spacer"></div>`;
 $('#sheetbody').querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{closeSheet();openForm(b.dataset.n,null)});
 openSheet();
}

function renderRooster(){
 const los=S.filter(s=>!s.rid&&s.ty!=='pt'&&s.d<7).length;
 $('#s-rooster').innerHTML=`
  <div class="preview" style="margin:16px 16px 0"><b>${REEKSEN.filter(r=>r.actief).reduce((n,r)=>n+r.dagen.length,0)} clubtrainingen per week</b>
   uit ${REEKSEN.filter(r=>r.actief).length} reeksen, plus ${los} losse sessies deze week.</div>
  <div class="sechead"><div><h2 style="font-size:17px">Reeksen</h2>
    <div class="sub">Vaste groepen, de basis van het rooster</div></div></div>
  ${REEKSEN.map(r=>`<button class="card tap" data-r="${r.id}">
    <div class="rowline"><b style="font-size:16px;font-weight:600">${r.act}</b>
      <span class="when">${r.actief?r.t+' – '+hhmm(mins(r.t)+r.dur):'Gepauzeerd'}</span></div>
    <div style="color:var(--muted);font-size:13px;margin-top:2px">${r.tr}, ${r.cap} plekken</div>
    <div class="rulechips">${DAGK.map((d,i)=>`<span class="rulechip${r.dagen.includes(i)?' on':''}">${d}</span>`).join('')}</div>
  </button>`).join('')}
  <div class="sechead"><div><h2 style="font-size:17px">Activiteiten</h2>
    <div class="sub">Lesvormen met hun standaardduur en tarief</div></div></div>
  ${ACTIVITEITEN.map(a=>`<div class="krow"><span class="av">${a.naam.replace(/[^A-Z]/g,'').slice(0,2)||a.naam.slice(0,2).toUpperCase()}</span>
    <span class="kmain"><b>${a.naam}</b><span>${TYL[a.ty]}, ${a.dur} min, ${a.cap} ${a.cap===1?'plek':'plekken'}</span></span>
    <span class="badge ${a.gratis?'b-both':'b-off'}">${a.gratis?'gratis':'€ '+a.tarief}</span></div>`).join('')}
  <div class="btnrow"><button class="btn" data-plus>Toevoegen aan het rooster</button></div>
  <p class="tip">Een nieuwe reeks vult de agenda vanaf vandaag. Sessies die al geweest zijn blijven staan, ook als je de reeks later wijzigt.</p>
  <div class="spacer"></div>`;
 $('#s-rooster').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>openForm('reeks',+b.dataset.r));
 $('#s-rooster').querySelector('[data-plus]').onclick=sheetNieuw;
}

function openForm(mode,id){
 if(mode==='reeks')FORM=id?{mode,...JSON.parse(JSON.stringify(REEKSEN.find(r=>r.id===id)))}
   :{mode,id:null,act:ACTIVITEITEN[0].naam,tr:ME.naam,dagen:[],t:'18:00',dur:45,cap:6,start:'07-09-2026',eind:null,actief:true};
 if(mode==='sessie')FORM={mode,act:ACTIVITEITEN[0].naam,tr:ME.naam,d:5,t:'11:00',dur:45,cap:6};
 if(mode==='activiteit')FORM={mode,naam:'',ty:'club',dur:45,cap:6,tarief:'17,50'};
 show('roosterform');
}

function renderForm(){
 const f=FORM,s=$('#s-roosterform');
 const actSel=(v,idd)=>`<select class="fin" id="${idd}">${ACTIVITEITEN.map(a=>
   `<option${a.naam===v?' selected':''}>${a.naam}</option>`).join('')}</select>`;
 const trSel=v=>`<select class="fin" id="f-tr">${TRAINERS.slice(1).map(t=>
   `<option${t===v?' selected':''}>${t}</option>`).join('')}</select>`;
 const durSel=v=>`<select class="fin" id="f-dur">${[30,45,60,75,90].map(d=>
   `<option${d===v?' selected':''} value="${d}">${d} minuten</option>`).join('')}</select>`;

 if(f.mode==='activiteit'){
  s.innerHTML=`
   <div class="field"><div class="flabel">Naam <em>*</em></div>
     <input class="fin" id="a-naam" value="${f.naam}" placeholder="Bijvoorbeeld CORE | KRACHT">
     <div class="fhelp">Zo staat het in de agenda en in de app van de klant</div></div>
   <div class="field"><div class="flabel">Soort</div>
     <div class="seg" id="a-ty">${['club','pt','fund'].map(t=>
       `<button class="segb${f.ty===t?' on':''}" data-ty="${t}">${TYL[t]}</button>`).join('')}</div>
     <div class="fhelp">Bepaalt de creditregels: ${f.ty==='pt'?'PT, 24 uur afmelden en 14 dagen inhalen':f.ty==='club'?'Clubtraining, 12 uur afmelden en 7 dagen inhalen':'Fundament loopt buiten de pool'}</div></div>
   <div class="field"><div class="flabel">Standaardduur</div>${durSel(f.dur)}</div>
   <div class="field"><div class="flabel">Standaard aantal plekken</div>
     <input class="fin" id="a-cap" value="${f.cap}" inputmode="numeric"></div>
   <div class="field"><div class="flabel">Los tarief</div>
     <input class="fin" id="a-tar" value="${f.tarief}" inputmode="decimal">
     <div class="fhelp">De prijs voor wie bijboekt zonder credit. In euro's.</div></div>
   <div class="savebar"><button class="btn" id="f-save">Activiteit opslaan</button>
     <button class="btn ghost" id="f-annu">Annuleren</button></div><div class="spacer"></div>`;
  s.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{f.ty=b.dataset.ty;
    f.cap=f.ty==='club'?6:1;f.dur=f.ty==='fund'?60:45;renderForm()});
  $('#f-dur').onchange=e=>{f.dur=+e.target.value};
  $('#f-save').onclick=()=>{
   f.naam=$('#a-naam').value.trim();f.cap=+$('#a-cap').value||1;f.tarief=$('#a-tar').value.trim()||'—';
   if(!f.naam){toast('Geef de activiteit een naam','Zonder naam weet een klant niet waar hij zich voor inschrijft.');return}
   if(ACTIVITEITEN.some(a=>a.naam.toLowerCase()===f.naam.toLowerCase())){toast('Deze naam bestaat al','Kies een andere naam, anders zijn de twee lesvormen in de agenda niet uit elkaar te houden.');return}
   ACTIVITEITEN.push({naam:f.naam,ty:f.ty,dur:f.dur,cap:f.cap,tarief:f.tarief});
   show('rooster');toast('Activiteit toegevoegd',`${f.naam} kun je nu kiezen bij een reeks of een losse sessie.`);
  };
  $('#f-annu').onclick=()=>show('rooster');
  return;
 }

 if(f.mode==='sessie'){
  s.innerHTML=`
   <div class="field"><div class="flabel">Activiteit</div>${actSel(f.act,'f-act')}</div>
   <div class="field"><div class="flabel">Trainer</div>${trSel(f.tr)}</div>
   <div class="field"><div class="flabel">Datum</div>
     <div class="chips" style="padding:10px 0 0">${DAYS.map((d,i)=>
       `<button class="chip${f.d===i?' on':''}" data-d="${i}">${d.k} ${d.d}</button>`).join('')}</div></div>
   <div class="field"><div class="flabel">Begintijd</div>
     <div class="timerow"><label class="tbox"><input id="f-h" value="${f.t.slice(0,2)}" inputmode="numeric" maxlength="2"><span>:</span><input id="f-m" value="${f.t.slice(3)}" inputmode="numeric" maxlength="2"></label>
     <span class="tot">duurt</span><span style="flex:1">${durSel(f.dur)}</span></div></div>
   <div class="field"><div class="flabel">Aantal plekken</div>
     <input class="fin" id="f-cap" value="${f.cap}" inputmode="numeric"></div>
   <div class="preview">${f.act} op ${DAYS[f.d].lang.toLowerCase()} ${DAYS[f.d].d} ${DAYS[f.d].m.toLowerCase()},
     <b>${f.t} – ${hhmm(mins(f.t)+f.dur)}</b> met ${f.tr}. ${f.cap} ${f.cap===1?'plek':'plekken'}.
     ${botsing(f)?`<br><span style="color:var(--red)">${f.tr} staat op dat moment al bij ${botsing(f).n}.</span>`:''}</div>
   <div class="savebar"><button class="btn" id="f-save">Sessie toevoegen</button>
     <button class="btn ghost" id="f-annu">Annuleren</button></div><div class="spacer"></div>`;
  bindGedeeld(f);
  s.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{f.d=+b.dataset.d;renderForm()});
  $('#f-save').onclick=()=>{
   leesTijd(f);f.cap=+$('#f-cap').value||1;
   const a=ACTIVITEITEN.find(a=>a.naam===f.act);
   S.push({id:SID++,d:f.d,t:f.t,dur:f.dur,ty:a.ty,n:f.act,tr:f.tr,cap:f.cap,bk:0,deelnemers:[],att:{},credit:{}});
   aday=f.d;aview='dag';show('agenda');
   toast('Sessie toegevoegd',`${f.act} staat nu op ${DAYS[f.d].lang.toLowerCase()} ${f.t} in de agenda. Klanten met een geldige credit kunnen zich vanaf nu inschrijven.`);
  };
  $('#f-annu').onclick=()=>show('rooster');
  return;
 }

 /* reeks */
 const perweek=f.dagen.length, plekken=perweek*f.cap;
 s.innerHTML=`
  <div class="field"><div class="flabel">Activiteit</div>${actSel(f.act,'f-act')}</div>
  <div class="field"><div class="flabel">Trainer</div>${trSel(f.tr)}</div>
  <div class="field"><div class="flabel">Herhalen op <em>*</em></div>
    <div class="seg" id="f-dagen">${DAGK.map((d,i)=>
      `<button class="segb${f.dagen.includes(i)?' on':''}" data-d="${i}">${d}</button>`).join('')}</div>
    <div class="fhelp">Dezelfde tijd op elk van deze dagen</div></div>
  <div class="field"><div class="flabel">Tijd</div>
    <div class="timerow"><label class="tbox"><input id="f-h" value="${f.t.slice(0,2)}" inputmode="numeric" maxlength="2"><span>:</span><input id="f-m" value="${f.t.slice(3)}" inputmode="numeric" maxlength="2"></label>
    <span class="tot">duurt</span><span style="flex:1">${durSel(f.dur)}</span></div></div>
  <div class="field"><div class="flabel">Aantal plekken</div>
    <input class="fin" id="f-cap" value="${f.cap}" inputmode="numeric">
    <div class="fhelp">Meer dan zes gaat ten koste van de aandacht per klant, dat is waar de studio op draait</div></div>
  <div class="field"><div class="flabel">Startdatum</div>
    <input class="fin" id="f-start" value="${f.start}" inputmode="numeric"></div>
  <div class="field"><div class="flabel">Einddatum instellen</div>
    <button class="sw${f.eind?' on':''}" id="f-eindsw" role="switch" aria-checked="${!!f.eind}"><i></i></button>
    ${f.eind?`<input class="fin" id="f-eind" value="${f.eind}" inputmode="numeric">`:''}
    <div class="fhelp">Zonder einddatum loopt de reeks door tot je hem pauzeert</div></div>
  <div class="field"><div class="flabel">Reeks actief</div>
    <button class="sw${f.actief?' on':''}" id="f-actief" role="switch" aria-checked="${f.actief}"><i></i></button>
    <div class="fhelp">${f.actief?'Staat in de agenda en is boekbaar voor klanten.'
      :'Gepauzeerd. Toekomstige sessies verdwijnen uit de agenda; sessies die al geweest zijn blijven staan.'}</div></div>
  <div class="preview">${perweek===0
    ?'<b>Nog geen dag gekozen.</b> Kies minstens één dag, anders levert deze reeks geen enkele training op.'
    :`<b>${perweek} ${perweek===1?'training':'trainingen'} per week</b>, ${plekken} plekken. ${dagtekst({days:f.dagen})} om ${f.t}, ${f.dur} minuten, met ${f.tr}.`}
    ${f.dagen.map(d=>botsing({...f,d})).filter(Boolean).length
      ?`<br><span style="color:var(--red)">${f.tr} staat op een van deze momenten al ingeroosterd.</span>`:''}</div>
  <div class="savebar"><button class="btn" id="f-save">${f.id?'Wijzigingen opslaan':'Reeks toevoegen'}</button>
    ${f.id?'<button class="btn ghost" id="f-del">Verwijderen</button>':'<button class="btn ghost" id="f-annu">Annuleren</button>'}</div>
  <div class="spacer"></div>`;
 bindGedeeld(f);
 s.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
  const i=+b.dataset.d;f.dagen=f.dagen.includes(i)?f.dagen.filter(x=>x!==i):[...f.dagen,i].sort();renderForm()});
 $('#f-eindsw').onclick=()=>{f.eind=f.eind?null:f.start;renderForm()};
 $('#f-actief').onclick=()=>{f.actief=!f.actief;renderForm()};
 $('#f-start').onchange=e=>{f.start=e.target.value};
 if($('#f-eind'))$('#f-eind').onchange=e=>{f.eind=e.target.value};
 $('#f-save').onclick=()=>{
  leesTijd(f);f.cap=+$('#f-cap').value||1;
  if(!f.dagen.length){toast('Kies eerst een dag','Een reeks zonder dagen levert geen trainingen op en verschijnt nergens.');return}
  const r={id:f.id||RID++,act:f.act,tr:f.tr,dagen:f.dagen,t:f.t,dur:f.dur,cap:f.cap,start:f.start,eind:f.eind,actief:f.actief};
  REEKSEN=f.id?REEKSEN.map(x=>x.id===r.id?r:x):[...REEKSEN,r];
  const n=genReeks(r);
  show('rooster');
  toast(f.id?'Reeks bijgewerkt':'Reeks toegevoegd',
   `${r.act} staat nu op ${dagtekst({days:r.dagen})} om ${r.t}. ${n} ${n===1?'sessie is':'sessies zijn'} vanaf vandaag in de agenda gezet. Sessies die al geweest zijn, zijn ongemoeid gelaten.`);
 };
 if($('#f-annu'))$('#f-annu').onclick=()=>show('rooster');
 if($('#f-del'))$('#f-del').onclick=()=>{
  $('#sheetbody').innerHTML=`<h3>Reeks verwijderen</h3>
   <p class="sub">Toekomstige sessies verdwijnen uit de agenda. Klanten die al ingeschreven staan krijgen hun credit terug — dat gaat niet vanzelf, dus laat het ze weten.</p>

function nieuweFactuur(kid){

  return t?[[k.prod+', september',1,t.prijs]]:[]};

     <select class="fin" id="n-k">${K.map(x=>`<option value="${x.id}"${x.id===k.id?' selected':''}>${x.n}</option>`).join('')}</select>
     <div class="fhelp">${k.prod}</div></div>
   <div class="field"><div class="flabel" style="font-size:15px">Regels</div>
     ${regels.length?regels.map((r,i)=>`<div class="chk on" style="cursor:default"><span class="box">✓</span>
       <span style="flex:1">${r[0]}</span><b>${eur(r[1]*r[2])}</b>
       <button class="linkb" data-del="${i}" style="margin-left:10px">×</button></div>`).join('')
      :'<div class="fhelp">Nog geen regels. Kies hieronder wat je in rekening brengt.</div>'}
     <div class="rulechips">${TARIEVEN.map((t,i)=>`<button class="rulechip" data-add="${i}">${t.naam} ${eur(t.prijs)}</button>`).join('')}</div>
   </div>
   <div class="field" style="padding-top:14px">
     <button class="chk${direct?' on':''}" id="n-direct"><span class="box">✓</span>Direct versturen met betaallink</button>
     <div class="fhelp">${direct?'De klant krijgt meteen een melding en kan met iDEAL betalen. Vervaldatum 18-09-2026.'
       :'Blijft als concept staan. De klant ziet er niets van tot je hem verstuurt.'}</div></div>
   <div class="preview">Totaal <b>${eur(bedrag)}</b> voor ${k.n}.</div>
   <div class="savebar"><button class="btn" id="n-save">${direct?'Aanmaken en versturen':'Concept bewaren'}</button>
     <button class="btn ghost" id="n-annu">Annuleren</button></div><div class="spacer"></div>`;
  $('#n-k').onchange=e=>{k=KI[e.target.value];regels=std();draw()};

   for(let w=0;w<4;w++){const dag=d+w*7;

    S.push({id:SID++,d:dag,t:tijd,dur:60,ty:'fund',n:'Fundament '+voor,tr,cap:1,bk:1,who:id,
     deelnemers:[id],att:{[id]:'open'},credit:{},
     focus:`Training ${w+1} van 4. `+(l.bevindingen||''),
     notes:[['nieuw',l.naam,'Nieuw, uit de intake van '+(l.intake?DAYS[l.intake.d].k+' '+l.intake.d:'deze week')]]});
    n++;
   }
   if(factuur)FACTUREN.unshift({nr:'2026-0'+(++FNR),kid:id,dat:'04-09-2026',verval:'18-09-2026',status:'open',
     wijze:'eenmalig',regels:[['Fundament Traject, 4 trainingen in 4 weken',1,t.prijs]]});
   l.status='gewonnen';l.klantId=id;
   closeSheet();openKlant(id);
   toast('Fundament Traject gestart',`${l.naam} staat in je klantenlijst met week 1 van 4. De vier trainingen zijn ingepland op ${DAYS[d].lang.toLowerCase()} ${tijd} bij ${tr}.${factuur?` De factuur van ${eur(t.prijs)} is verstuurd met een betaallink.`:''}`);
  };
 };
 draw();openSheet();
}

/* =============== evaluatie na het Fundament Traject =============== */
const KLACHT=/klacht|klaag|pijn|blessure|gevoelig|last van/i;          /* in de weeknotities */
const LICHAAM=/knie|rug|schouder|nek|enkel|pols|hernia/i;              /* in het aanvraagformulier */
const weken=a=>a.length===1?'week '+a[0]:'week '+a.slice(0,-1).join(', ')+' en '+a[a.length-1];
const GOED=/techniek (zit|goed|in orde)|klaar voor de groep|zelfstandig|houding is goed/i;
const teEvalueren=()=>K.filter(k=>k.traject&&k.traject.klaar);

function trajectAdvies(k){
 const t=k.traject, log=t.log||[], red=[];
 let score=0;
 const klachten=log.filter(l=>KLACHT.test(l[2]));
 if(klachten.length){score-=3;
  red.push(['blessure','Klacht genoteerd in '+weken(klachten.map(l=>l[0])),
   '"'+klachten[klachten.length-1][2]+'"']);}
 const bles=(t.form||{}).Blessures||'';
 if(LICHAAM.test(bles)){score-=1;red.push(['blessure','Zelf opgegeven bij de aanvraag',bles])}
 const ann=parseFloat(k.ann)||0;
 if(ann>=25){score-=2;red.push(['credit',`Annulering ${k.ann}`,'Onregelmatige aanwezigheid valt in een vaste groep meteen op.'])}
 else if(k.bez!=='—'&&parseFloat(k.bez)>=90){score+=1;red.push(['nieuw',`Aanwezigheid ${k.bez}`,'Kwam elke training, past bij een vaste groep.'])}
 const erv=(t.form||{}).Ervaring||'';
 if(/nauwelijks|geen/i.test(erv)){score-=1;red.push(['vrij','Weinig trainingservaring','Uit het aanvraagformulier: “'+erv+'”'])}
 else if(erv){score+=1;red.push(['vrij','Heeft eerder getraind','Uit het aanvraagformulier: “'+erv+'”'])}
 const pos=log.filter(l=>GOED.test(l[2]));
 if(pos.length){score+=3;red.push(['nieuw','Techniek beoordeeld als voldoende','"'+pos[pos.length-1][2]+'"'])}
 if(t.advies==='club'){score+=1;red.push(['vrij','Indruk na de intake','Clubtraining'])}
 if(t.advies==='pt'){score-=1;red.push(['vrij','Indruk na de intake','Personal Training'])}
 return {keuze:score>=3?'club':score<=0?'pt':'twijfel',score,red,klachten:klachten.length>0};
}
const ADVL={club:['Clubtraining','Kan zelfstandig mee in een vaste groep.'],
 pt:['Personal Training','Heeft nog persoonlijke begeleiding nodig.'],
 twijfel:['Twijfelgeval','De signalen wijzen twee kanten op. Bespreek het samen.']};

function openEvaluatie(id){
 const k=KI[id], a=trajectAdvies(k);
 let keuze=a.keuze==='twijfel'?'pt':a.keuze, prod=null, bericht=true;
 const opties=()=>TARIEVEN.filter(t=>t.groep===keuze&&!t.concept);
 prod=opties()[0]?opties()[0].naam:null;
 const draw=()=>{
  const lijst=opties(); if(!lijst.some(t=>t.naam===prod))prod=lijst[0]?lijst[0].naam:null;
  const t=lijst.find(x=>x.naam===prod);
  const [al,az]=ADVL[a.keuze];
  $('#sheetbody').innerHTML=`
   <h3>Evaluatie ${k.n.split(' ')[0]}</h3>
   <p class="sub">Fundament Traject afgerond op ${k.traject.afgerond}</p>

   <div class="card" style="background:${a.keuze==='club'?'var(--steen-50)':a.keuze==='pt'?'#EFE6DA':'#F6EBD8'};border-color:transparent">
     <div style="color:var(--muted);font-size:12.5px">Advies op basis van formulier, intake en de vier trainingen</div>
     <b style="display:block;font-size:19px;font-weight:600;margin-top:3px">${al}</b>
     <div style="font-size:13.5px;margin-top:2px">${az}</div></div>

   <div class="sechead" style="padding-bottom:0"><div><h2 style="font-size:16px">Waarom</h2></div></div>
   <ul class="notes" style="margin:8px 16px">${a.red.map(r=>
     `<li><span class="tag t-${r[0]}">${lbl(r[0])}</span><span><u>${r[1]}</u>${r[2]?' — '+r[2]:''}</span></li>`).join('')}</ul>

   <div class="sechead" style="padding-bottom:0"><div><h2 style="font-size:16px">De vier trainingen</h2></div></div>
   <div class="card">${k.traject.log.map(l=>
     `<div class="kv" style="align-items:flex-start"><span style="flex:none;width:58px">Week ${l[0]}</span>
      <b style="text-align:left;font-weight:400;flex:1">${l[2]}<br><span style="color:var(--muted);font-size:12px">${l[1]}</span></b></div>`).join('')}</div>

   <div class="sechead" style="padding-bottom:0"><div><h2 style="font-size:16px">Wat wordt het</h2></div></div>
   <div class="seg" style="margin:10px 16px">${[['club','Club'],['pt','Personal Training'],['combi','Combi']].map(([kk,lb])=>
     `<button class="segb${keuze===kk?' on':''}" data-k="${kk}">${lb}</button>`).join('')}</div>

   ${keuze==='club'&&a.klachten?`<div class="card note"><b style="font-weight:600">Weet je het zeker?</b>
     <p style="margin:6px 0 0;font-size:13.5px">In een clubtraining verwachten we dat iemand zelfstandig en klachtenvrij op niveau kan bewegen. Bij ${k.n.split(' ')[0]} staan er klachten genoteerd tijdens het traject. Personal Training is dan meestal de eerlijkere keuze, ook voor de rest van de groep.</p></div>`:''}
   ${keuze==='combi'?`<div class="card note"><b style="font-weight:600">Bestaat nog niet</b>
     <p style="margin:6px 0 0;font-size:13.5px">Het combi-abonnement staat op de rol. Tot die tijd zet je twee losse abonnementen naast elkaar.</p></div>`:''}

   ${lijst.length?`<div class="field" style="padding-top:6px"><div class="flabel" style="font-size:15px">Abonnement</div>
     <select class="fin" id="e-p">${lijst.map(x=>`<option${x.naam===prod?' selected':''}>${x.naam}</option>`).join('')}</select>
     <div class="fhelp">${t?eur(t.prijs)+' per maand via automatische incasso, '+t.sessies+' '+(t.sessies===1?'sessie':'sessies')+' per week':''}</div></div>`:''}

   <div class="field" style="padding-top:14px">
     <button class="chk${bericht?' on':''}" id="e-ber"><span class="box">✓</span>Uitkomst naar ${k.n.split(' ')[0]} sturen</button>
     <div class="fhelp">${bericht?'Hij krijgt een bericht met de uitkomst en wanneer zijn eerste sessie is.'
       :'Je vertelt het zelf. Zonder bericht blijft er niets van de evaluatie vastgelegd voor de klant.'}</div></div>

   <div class="savebar"><button class="btn" id="e-save"${lijst.length?'':' disabled style="opacity:.5"'}>Vastleggen</button>
     <button class="btn ghost" id="e-later">Nog niet</button></div>
   <div class="btnrow"><button class="btn ghost" id="e-stop" style="color:var(--red)">Gaat niet door</button></div>
   <div class="spacer"></div>`;
  $('#sheetbody').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{keuze=b.dataset.k;draw()});
  if($('#e-p'))$('#e-p').onchange=e=>{prod=e.target.value;draw()};
  $('#e-ber').onclick=()=>{bericht=!bericht;draw()};
  $('#e-later').onclick=closeSheet;
  $('#e-stop').onclick=()=>{
   k.st='Inactief';k.prod='Geen actief product';k.traject.klaar=false;
   closeSheet();renderDash();
   toast('Afgesloten',`${k.n} staat nu op inactief. Het traject is afgerond, er start geen abonnement.`);
  };
  $('#e-save').onclick=()=>{
   const gekozen=lijst.find(x=>x.naam===prod);
   k.prod=gekozen.naam;k.p=keuze==='club'?'club':'pt';
   k.cr=[gekozen.sessies||1,0];k.st='Actief';
   k.traject.klaar=false;k.traject.uitkomst=gekozen.naam;
   k.next='in te plannen';
   k.note={a:ME.naam,t:'zojuist',x:`Na het Fundament gekozen voor ${gekozen.naam}. ${a.red[0]?a.red[0][1]+'.':''}`};
   if(bericht)(CHAT[k.id]=CHAT[k.id]||[]).push(['us',
     `Je Fundament Traject zit erop. We gaan verder met ${gekozen.naam}: ${gekozen.sessies} ${gekozen.sessies===1?'sessie':'sessies'} per week. Je kunt vanaf nu inplannen in de app. De incasso start op 1 oktober.`,'nu']);
   closeSheet();renderDash();
   toast('Vastgelegd',`${k.n} gaat verder met ${gekozen.naam}. De incasso start op 1 oktober${bericht?' en hij heeft bericht gekregen':''}.`);
  };
 };
 draw();openSheet();
}

/* =============== sheet + nav =============== */
function openSheet(){$('#sheet').classList.add('on');$('#scrim').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on')}
$('#scrim').onclick=()=>{closeSheet();closeDrawer()};

const TABS=[['dashboard','dash','Dashboard'],['agenda','cal','Agenda'],['klanten','people','Klanten'],
            ['financien','card','Financiën'],['meer','menu','Menu']];
function drawTabs(cur){
 const t=$('#tabs');t.innerHTML='';
 TABS.forEach(([k,i,l])=>{
  const on=k===cur||(cur==='klant'&&k==='klanten')||(cur==='chat'&&k==='klanten')
    ||(cur==='cijfers'&&k==='dashboard')||(['beschik','beschikedit','rooster','roosterform','updates'].includes(cur)&&k==='meer');
  const b=el('button','tab'+(on?' on':''),IC[i]+l);
  b.onclick=()=>k==='meer'?openDrawer():show(k);t.appendChild(b);
 });
}
function show(name){
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
 $('#s-'+name).classList.add('on');
 if(name==='dashboard')renderDash();
 if(name==='agenda')renderAgenda();
 if(name==='klanten')renderKlanten();
 if(name==='updates')renderUpd();
 if(name==='meer')renderMeer();
 if(name==='beschik')renderBeschik();
 if(name==='beschikedit')renderRule();
 if(name==='cijfers')renderCijfers();
 if(name==='rooster')renderRooster();
 if(name==='financien')renderFin();
 if(name==='roosterform')renderForm();
 huidigScherm=name;drawHeader(name);drawTabs(name);renderDrawer();$('#main').scrollTop=0;
}
let _bw=breed();
addEventListener('resize',()=>{
 if(breed()===_bw)return;_bw=breed();
 if(huidigScherm==='agenda')renderAgenda();
 renderDrawer();
});
show('dashboard');
</script>
